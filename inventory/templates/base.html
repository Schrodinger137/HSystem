{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link href="{% static 'css/bootstrap.min.css' %}">
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Ajusta el contenido para que no quede debajo del sidebar */
    .main-content {
      margin-left: 200px;
      /* Ancho del sidebar */
      padding: 20px;
    }

    .navbar-dark-soft {
      background-color: #2c2f33 !important;
      /* dark suave tipo Discord */
    }

    /* Fondo oscuro personalizado del contenido */
    .main-content {
      margin-left: 200px;
      padding: 20px;
      background-color: #1e1f23;
      min-height: 100vh;
      color: #e4e6eb;
    }

    /* Cards adaptadas al fondo oscuro */
    .card {
      border: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
    }

    /* Texto secundario más suave */
    .card-text {
      opacity: .85;
    }

    /* Navbar oscura suave (ya la tienes, la dejo afinada) */
    .navbar-dark-soft {
      background-color: #2c2f33 !important;
    }

    /* Cards de gráficas */
    .chart-card {
      background-color: #25272d;
      height: 320px;
    }

    .chart-card .card-body {
      display: flex;
      flex-direction: column;
    }

    .chart-card canvas {
      max-height: 170px !important;
    }

    .chart-card h5 {
      font-size: .95rem;
      color: #cfd8ff;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>
  {% include 'inc/sidebar.html' %}
  <nav class="navbar navbar-expand-lg navbar-dark-soft border-dark sticky-top shadow-sm" id="mainNavbar">
    <div class="container-fluid">
      <a class="navbar-brand text-light" href="{% url 'index' %}">HSJ</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <!-- Opciones de la izquierda -->
        <nav aria-label="breadcrumb" class="px-3 pt-2">
          <ol class="breadcrumb mb-0">
            {% block breadCrumb %}{% endblock %}
          </ol>
        </nav>

        <!-- Botón a la derecha -->
        <div class="d-flex ms-auto align-items-center">

          <div class="d-flex gap-2">
            {% block headerOptions %}
            {% endblock %}
          </div>
        </div>

      </div>

    </div>
  </nav>

  <div class="main-content">

    {% block content %}{% endblock %}
  </div>

  {% include 'inc/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
