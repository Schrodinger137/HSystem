{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    /* Ajusta el contenido para que no quede debajo del sidebar */
    .main-content {
      margin-left: 200px;
      /* Ancho del sidebar */
      padding: 20px;
    }

    .navbar-dark-soft {
      background-color: #2c2f33 !important;
      /* dark suave tipo Discord */
    }

    /* Fondo oscuro personalizado del contenido */
    .main-content {
      margin-left: 200px;
      padding: 20px;
      background-color: #1e1f23;
      min-height: 100vh;
      color: #e4e6eb;
    }

    /* Cards adaptadas al fondo oscuro */
    .card {
      border: none;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .5);
    }

    /* Texto secundario más suave */
    .card-text {
      opacity: .85;
    }

    /* Navbar oscura suave (ya la tienes, la dejo afinada) */
    .navbar-dark-soft {
      background-color: #2c2f33 !important;
    }

            /* Cards de gráficas */
        .chart-card {
            background-color: #25272d;
            height: 320px;
        }

        .chart-card .card-body {
            display: flex;
            flex-direction: column;
        }

        .chart-card canvas {
            max-height: 170px !important;
        }

        .chart-card h5 {
            font-size: .95rem;
            color: #cfd8ff;
            margin-bottom: 10px;
        }
  </style>
</head>

<body>

  {% include 'inc/header.html' %}
  {% include 'inc/sidebar.html' %}

  <div class="main-content">
    {% block content %}{% endblock %}
  </div>

  {% include 'inc/footer.html' %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
